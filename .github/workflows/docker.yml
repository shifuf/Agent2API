name: Docker package

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Select image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "$image:sha-$GITHUB_SHA"
            case "$GITHUB_REF" in
              refs/heads/main) echo "$image:latest" ;;
              refs/heads/beta) echo "$image:beta" ;;
              *) echo "$image:dev" ;;
            esac
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      # Rust cross-compiles on the host. QEMU is only needed for the small
      # target-architecture runtime stage (apt-get and the image build checks).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish gateway and panel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=agent2api-docker
          cache-to: type=gha,mode=max,scope=agent2api-docker

      - name: Show published image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo '### Published Docker images'
            echo
            printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r tag; do
              printf -- '- `%s`\n' "$tag"
            done
            echo
            echo 'Platforms: linux/amd64 and linux/arm64. The UI is built from this commit.'
          } >> "$GITHUB_STEP_SUMMARY"
